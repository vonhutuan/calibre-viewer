<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f7f4ec">
    <link rel="manifest" href="./app.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/calibre-180.png">
    <title>Calibre Library</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Calibre Library</h1>
        <div id="actions" class="actions" hidden>
          <button id="refresh" type="button">Refresh</button>
          <button id="sign-out" type="button">Sign out</button>
        </div>
      </header>
      <section id="welcome" class="welcome">
        <h2>Your books, wherever you are</h2>
        <p>Sign in to browse and download your Calibre books from OneDrive.</p>
        <button id="sign-in" class="primary" type="button" disabled>Sign in with Microsoft</button>
      </section>
      <section id="library" aria-label="Library catalog" hidden>
        <div class="toolbar">
          <label for="search">Search by title or author</label>
          <input type="search" id="search" placeholder="Search your library">
          <p id="count" aria-live="polite"></p>
        </div>
        <ul id="books" class="books"></ul>
      </section>
      <p id="status" role="status"></p>
      <button id="retry-sign-in" class="primary" type="button" hidden>Sign in again</button>
    </main>
    <dialog id="details" aria-labelledby="book-title">
      <form method="dialog"><button class="close" aria-label="Close book details">×</button></form>
      <div class="book-heading">
        <img id="book-cover" class="book-cover" alt="" hidden>
        <div>
          <h2 id="book-title"></h2>
          <p id="book-authors"></p>
          <p id="book-series" hidden></p>
          <p id="book-tags" hidden></p>
        </div>
      </div>
      <p id="book-description" hidden></p>
      <div id="formats" class="actions"></div>
      <p id="download-status" role="status"></p>
    </dialog>
    <template id="book-card">
      <li>
        <button class="book" type="button">
          <span class="title"></span>
          <span class="authors"></span>
        </button>
      </li>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
